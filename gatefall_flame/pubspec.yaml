name: gatefall
description: Gatefall — idle action-RPG x romance simulation.
publish_to: 'none'
# 2.0.0 — "Ascension". Every route's Beat 6 now grants the transformed
# ability it always promised, and Dana awakens into the party. The build
# number is what Android orders installs by, so it goes up with every
# release: 1.0.0 shipped as +1.
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  gatefall_dialogue_engine:
    path: ../gatefall_dialogue_engine
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - data/
    - data/scenes/
