name: gatefall
description: Gatefall — idle action-RPG x romance simulation.
publish_to: 'none'
# 3.3.3 — ascension reveal. Completing Beat 6 now presents the companion,
# unlocked ability and passive as a dedicated route-completion reward.
#
# 3.3.2 — ascended combat feedback. Passive triggers now announce themselves
# in the battle log with Ascension sound/colour, including Dana's opening shield.
#
# 3.3.1 — ascension visibility. Character profiles, Party progression and
# gate formation now explain/show the route-finished passive before combat.
#
# 3.3.0 — "Together". Route completion now reshapes each companion's base kit
# with an ascended passive, while the post-3.2 mobile/raid-control hardening and
# narrative continuity fixes ship together as one clean release.
#
# 3.2.0 — first-session polish. The opening now carries the player from Faelen's
# first beat into the first gate and back home, character profiles can present
# full-body rendered art, and dialogue mirrors are checked automatically in CI.
#
# 3.1.0 — "Cold Open". The game opens on a six-page comic that says what it
# is: the gates, what came through, what woke up, and the elf on the step.
#
# 3.0.0 — "Illumination". The game finally looks and sounds like itself:
# drawn characters, a gate you can watch turn, combat that reacts, and a
# score synthesised from scratch. The build number is what Android orders
# installs by, so it goes up with every release: 1.0.0 shipped as +1.
version: 3.3.3+9

environment:
  # Raised from >=3.0.0 for audioplayers, which is what version 3's sound
  # runs on and which needs a 3.6 SDK.
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # The one sound plugin that covers Android, web and desktop unchanged —
  # the same reason shared_preferences is the save layer.
  audioplayers: ^6.5.0
  flame: ^1.18.0
  gatefall_dialogue_engine:
    path: ../gatefall_dialogue_engine
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - data/
    - data/scenes/
    # Synthesised by tool/make_sounds.py. Committed rather than generated at
    # build time so a clone plays sound with nothing installed.
    - assets/audio/
    # Rendered character/enemy sprites (Approach A — see lib/art/sprites.dart
    # and assets/sprites/README.md). Empty of art today: the game ships on
    # painted silhouettes and shows a PNG the moment one is dropped in under
    # the right name. Directories are declared so that drop-in needs no
    # pubspec edit.
    - assets/sprites/characters/
    - assets/sprites/characters/faelen/animations/idle/runtime/
    - assets/sprites/characters/faelen/animations/attack/runtime/
    # Canonical Kess profile art lives in a nested source folder. Flutter
    # directory asset entries are not recursive, so include this level too.
    - assets/sprites/characters/kess/
    - assets/sprites/characters/kess/animations/idle/runtime/
    - assets/sprites/characters/kess/animations/attack/runtime/
    - assets/sprites/characters/kess/animations/hurt/runtime/
    - assets/sprites/characters/kess/animations/death/runtime/
    - assets/sprites/enemies/
