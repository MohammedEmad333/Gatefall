name: gatefall
description: Gatefall — idle action-RPG x romance simulation.
publish_to: 'none'
# 3.0.0 — "Illumination". The game finally looks and sounds like itself:
# drawn characters, a gate you can watch turn, combat that reacts, and a
# score synthesised from scratch. The build number is what Android orders
# installs by, so it goes up with every release: 1.0.0 shipped as +1.
version: 3.0.0+3

environment:
  # Raised from >=3.0.0 for audioplayers, which is what version 3's sound
  # runs on and which needs a 3.6 SDK.
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # The one sound plugin that covers Android, web and desktop unchanged —
  # the same reason shared_preferences is the save layer.
  audioplayers: ^6.5.0
  flame: ^1.18.0
  gatefall_dialogue_engine:
    path: ../gatefall_dialogue_engine
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - data/
    - data/scenes/
    # Synthesised by tool/make_sounds.py. Committed rather than generated at
    # build time so a clone plays sound with nothing installed.
    - assets/audio/
