name: gatefall
description: Gatefall — idle action-RPG x romance simulation.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  gatefall_dialogue_engine:
    path: ../gatefall_dialogue_engine
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - data/
    - data/scenes/
