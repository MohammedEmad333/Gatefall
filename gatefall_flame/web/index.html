<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Gatefall — an idle action-RPG and romance simulation. Clear the gates, build the house, and find out what everyone in it is really afraid of.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gatefall">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gatefall</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The app paints its own night-blue ground; matching it here stops the
       white flash between the page loading and the first Flutter frame. */
    html, body { margin: 0; padding: 0; height: 100%; background: #0D0B1A; }
  </style>
</head>
<body>
  <!--
    Load CanvasKit from the copy inside this build rather than from the Google
    CDN the loader reaches for by default. That makes the build entirely
    self-contained: it runs off any static file server, with no outbound
    network at all, which is what "open it and play" has to mean.
  -->
  <script>
    window.flutterConfiguration = { canvasKitBaseUrl: "canvaskit/" };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
