name: Build APK

# Builds the Gatefall Flutter app into an Android APK.
#
# The repo only scaffolds the `web` platform (see gatefall_flame/.metadata),
# so this workflow generates the Android platform files in CI with
# `flutter create` before building. Nothing Android-specific is committed.
#
# On a push to main the built APK is also published as a GitHub Release,
# tagged with the version in gatefall_flame/pubspec.yaml — so "the current
# build of the game" is a link rather than a workflow artifact that expires.

on:
  push:
    branches:
      - main
      - claude/**
    paths:
      - 'gatefall_flame/**'
      - 'gatefall_dialogue_engine/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'gatefall_flame/**'
      - 'gatefall_dialogue_engine/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    # Publishing a release needs write access to the repo contents. Only the
    # main-branch run uses it; everything else runs read-only.
    permissions:
      contents: write

    defaults:
      run:
        working-directory: gatefall_flame

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Read app version
        id: version
        # The single source of truth is pubspec.yaml. `2.0.0+2` -> name
        # 2.0.0, build 2; the tag is v2.0.0.
        run: |
          full="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          name="${full%%+*}"
          build="${full##*+}"
          # A version with no "+build" suffix leaves build == full. Written
          # as an if rather than `[ ] && x=1` because GitHub runs steps under
          # `bash -e`, where a false test as a bare command ends the step.
          if [ "$build" = "$full" ]; then build=1; fi
          echo "full=$full"        >> "$GITHUB_OUTPUT"
          echo "name=$name"        >> "$GITHUB_OUTPUT"
          echo "build=$build"      >> "$GITHUB_OUTPUT"
          echo "tag=v$name"        >> "$GITHUB_OUTPUT"
          echo "Building Gatefall $name (build $build)"

      - name: Generate Android platform files
        # The Android platform is not committed; regenerate it here. This only
        # adds the android/ scaffolding and never touches lib/ or assets.
        run: flutter create --platforms=android --org com.gatefall --project-name gatefall .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Informational only — a lint finding must not block the APK build.
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        # The balance and save-state suites are fast and catch exactly the
        # things that are miserable to find on a phone. Informational for the
        # same reason analyze is: a red test must not stop someone getting a
        # build to play.
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Is a signing key configured?
        id: signing
        # The `secrets` context cannot be used in a step `if:`, so it is
        # mapped to an env var here and the result exposed as an output.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign the APK
        # Why re-sign rather than wire a signingConfig into Gradle: the
        # android/ directory is generated by `flutter create` in the step
        # above, so a Gradle edit would be a patch against a template that
        # changes between Flutter versions. Signing the built artifact
        # depends only on the APK and the SDK's own tools, and it verifies
        # itself below.
        #
        # zipalign runs first and deliberately drops the throwaway debug
        # signature Gradle applied; apksigner then applies ours as the only
        # signature on the file.
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          tools="$(ls -d "$sdk"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: $tools"

          keystore="$(mktemp -d)/upload.jks"
          # tr guards the copy-paste path: a secret pasted with wrapped
          # lines or a trailing newline still decodes.
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$keystore"

          in=build/app/outputs/flutter-apk/app-release.apk
          out="build/app/outputs/flutter-apk/gatefall-${NAME}.apk"

          "$tools/zipalign" -p -f 4 "$in" aligned.apk
          "$tools/apksigner" sign \
            --ks "$keystore" \
            --ks-pass env:KS_PASS \
            --key-pass env:KS_PASS \
            --ks-key-alias "${KEY_ALIAS:-gatefall}" \
            --v4-signing-enabled false \
            --out "$out" \
            aligned.apk
          rm -f "$keystore" aligned.apk

          # Prove it worked, and that the result is not still the per-runner
          # debug key — the whole point of this step. A build that quietly
          # shipped a debug-signed APK would be an APK nobody can update to.
          certs="$("$tools/apksigner" verify --print-certs "$out")"
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::APK is still signed with the debug key."
            exit 1
          fi
          fingerprint="$(echo "$certs" | grep -i 'SHA-256 digest' | head -1)"
          {
            echo "### Signed \`gatefall-${NAME}.apk\`"
            echo ""
            echo "Signer: $(echo "$certs" | grep -i 'Signer #1 certificate DN' | head -1)"
            echo ""
            echo "\`$fingerprint\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Name the APK after the version
        # Unsigned-key path only: with no keystore configured there is
        # nothing to re-sign, so the Gradle output is simply renamed and the
        # release below is skipped.
        if: steps.signing.outputs.available != 'true'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/gatefall-${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gatefall-${{ steps.version.outputs.name }}-apk
          path: gatefall_flame/build/app/outputs/flutter-apk/gatefall-${{ steps.version.outputs.name }}.apk
          if-no-file-found: error

      - name: Publish release
        # Only main publishes, and only a properly signed APK. Uses the `gh`
        # CLI that ships on the runner rather than a third-party action, and
        # re-uploads over an existing release of the same version so a
        # workflow fix never needs a version bump to be re-run.
        if: |
          github.ref == 'refs/heads/main'
          && github.event_name != 'pull_request'
          && steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/gatefall-${NAME}.apk"
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          Gatefall ${NAME} (build ${BUILD}).

          Install \`gatefall-${NAME}.apk\` on an Android device — Android will
          ask you to allow installation from an unknown source.

          Updating from an earlier 2.x release installs over the top and keeps
          your save. Progress lives in the app's own storage and the save
          format is backward compatible.

          Built from ${GITHUB_SHA}.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" "$apk" \
              --title "Gatefall ${NAME}" \
              --notes-file "$notes"
          fi

      - name: Explain a skipped release
        # A push to main that publishes nothing must say why on the run page,
        # not only deep in a log.
        if: |
          github.ref == 'refs/heads/main'
          && github.event_name != 'pull_request'
          && steps.signing.outputs.available != 'true'
        run: |
          echo "::warning::No release published: ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are not set, so this APK would be signed with a throwaway per-runner debug key that no future build could update."
          {
            echo "### Release skipped"
            echo ""
            echo "No signing key is configured, so this APK is signed with a"
            echo "per-runner debug key. Android refuses to install an update"
            echo "whose signature differs from the installed app, so publishing"
            echo "it would produce a release nobody could update from."
            echo ""
            echo "Set the repository secrets \`ANDROID_KEYSTORE_BASE64\` and"
            echo "\`ANDROID_KEYSTORE_PASSWORD\` to enable releases."
          } >> "$GITHUB_STEP_SUMMARY"
